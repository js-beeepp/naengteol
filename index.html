<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냉털 – 냉장고 재료로 만들 수 있는 요리 추천</title>
<meta name="description" content="냉장고에 있는 재료를 적으면, 지금 만들 수 있는 요리와 레시피를 추천합니다.">
<style>
  :root {
    --bg: #fbf6ec;
    --surface: #fffdf8;
    --surface-2: #f6efe0;
    --ink: #2b2118;
    --ink-2: #6c5f50;
    --line: #eadfcc;
    --accent: #c4421f;
    --accent-ink: #ffffff;
    --accent-soft: #fde7df;
    --ok: #2a7346;
    --ok-soft: #e1f0e5;
    --warn: #9a5a00;
    --warn-soft: #fbeccb;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(43,33,24,.05), 0 6px 18px rgba(43,33,24,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17120d;
      --surface: #211a13;
      --surface-2: #2a2118;
      --ink: #f6eee2;
      --ink-2: #bfb09b;
      --line: #3a2f23;
      --accent: #ff8a65;
      --accent-ink: #2a0f05;
      --accent-soft: #43231a;
      --ok: #7fd49b;
      --ok-soft: #1c3526;
      --warn: #f2c26b;
      --warn-soft: #3b2e12;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 80px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -0.03em; line-height: 1.15; }
  .tag { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
  .count { font-size: 13px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; white-space: nowrap; }
  .count b { color: var(--accent); font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel { padding: 20px; margin-bottom: 24px; }
  .q { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; }
  .addrow { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 48px;
  }
  select {
    font: inherit; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 12px 18px; min-height: 48px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  .btn:hover { filter: brightness(1.05); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
  .btn.sub { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font-weight: 700; }
  .btn.big { width: 100%; font-size: 17px; margin-top: 16px; }
  .btn.small { min-height: 38px; padding: 7px 14px; font-size: 14px; border-radius: 10px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; padding: 7px 8px 7px 14px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .chip button { border: 0; background: transparent; color: inherit; font-size: 17px; line-height: 1; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; }
  .chip button:hover { background: rgba(0,0,0,.08); }
  .quick { margin-top: 14px; }
  .quick p { margin: 0 0 8px; font-size: 13px; color: var(--ink-2); }
  .qbtn { font: inherit; font-size: 14px; padding: 7px 13px; margin: 0 6px 8px 0; border-radius: 99px; border: 1px dashed var(--ink-2); background: transparent; color: var(--ink); cursor: pointer; min-height: 36px; }
  .qbtn[aria-pressed=true] { background: var(--surface-2); border-style: solid; color: var(--ink-2); }
  .opts { display: grid; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .optrow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .optrow label.f { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
  .tool { font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); cursor: pointer; min-height: 38px; }
  .tool[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
  .note { margin: 12px 0 0; font-size: 12.5px; color: var(--ink-2); }

  .status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; font-size: 13.5px; color: var(--ink-2); }
  .badge { font-size: 12.5px; font-weight: 800; padding: 3px 10px; border-radius: 99px; }
  .badge.ai { background: var(--ok-soft); color: var(--ok); }
  .badge.local { background: var(--warn-soft); color: var(--warn); }
  h2.sec { font-size: 17px; margin: 22px 0 10px; letter-spacing: -0.02em; }
  h2.sec span { color: var(--ink-2); font-weight: 600; font-size: 14px; }

  .rcard { padding: 18px 18px 6px; margin-bottom: 12px; }
  .rtop { display: flex; gap: 14px; align-items: flex-start; }
  .ph { flex: 0 0 92px; width: 92px; height: 92px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 38px; overflow: hidden; }
  .ph a { display: block; width: 100%; height: 100%; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rmain { min-width: 0; flex: 1; }
  .rmain h3 { margin: 0; font-size: 19px; letter-spacing: -0.02em; line-height: 1.3; }
  .meta { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
  .sum { margin: 6px 0 8px; color: var(--ink-2); font-size: 14.5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tg { font-size: 13px; padding: 3px 10px; border-radius: 99px; font-weight: 700; }
  .tg.have { background: var(--ok-soft); color: var(--ok); }
  .tg.need { background: var(--warn-soft); color: var(--warn); }
  .unused { margin: 0 0 12px; padding: 10px 12px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; font-size: 13.5px; }
  .credit { margin: 4px 0 0; font-size: 12px; color: var(--ink-2); }
  @media (min-width: 560px) { .ph { flex-basis: 116px; width: 116px; height: 116px; font-size: 48px; } }
  .rcard details { border-top: 1px solid var(--line); margin-top: 10px; }
  .rcard summary { list-style: none; cursor: pointer; padding: 12px 0; font-weight: 800; font-size: 15px; display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
  .rcard summary::-webkit-details-marker { display: none; }
  .rcard summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(45deg); transition: transform .2s; margin-right: 4px; }
  .rcard details[open] summary::after { transform: rotate(-135deg); }
  .body { padding-bottom: 14px; }
  .body h4 { margin: 10px 0 6px; font-size: 14px; color: var(--ink-2); letter-spacing: 0; }
  ul.ing { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 16px; font-size: 14.5px; }
  ul.ing li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
  ul.ing li span:last-child { color: var(--ink-2); }
  ol.steps { margin: 0; padding-left: 22px; font-size: 15px; }
  ol.steps li { margin-bottom: 6px; }
  .tip { margin: 10px 0 12px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; font-size: 14px; }

  .skeleton { height: 120px; margin-bottom: 12px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
  @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .loading-t { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
  .empty { padding: 24px 20px; text-align: center; color: var(--ink-2); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>냉털</h1>
      <p class="tag">냉장고에 있는 재료 그대로, 지금 만들 수 있는 요리를 알려드려요.</p>
    </div>
    <div class="count" id="count">이번 달 해먹은 횟수 <b>0</b></div>
  </header>

  <section class="card panel" aria-labelledby="q1">
    <h2 class="q" id="q1">냉장고에 뭐가 있어요?</h2>
    <form class="addrow" id="addForm" autocomplete="off">
      <input type="text" id="ingInput" placeholder="예: 계란, 양파, 대파" maxlength="80" aria-label="재료 이름">
      <button class="btn sub" type="submit">추가</button>
    </form>
    <div class="chips" id="chips" aria-live="polite"></div>
    <div class="quick">
      <p>자주 있는 재료를 눌러 추가하거나, 위 칸에 직접 적어 주세요 (예: 새우, 가지, 버섯)</p>
      <div id="quick"></div>
    </div>
    <div class="opts">
      <div class="optrow">
        <label class="f">인분
          <select id="servings"><option value="1">1인분</option><option value="2">2인분</option><option value="3">3인분</option><option value="4">4인분</option></select>
        </label>
        <label class="f">시간
          <select id="maxMin"><option value="15">15분 이내</option><option value="30">30분 이내</option><option value="60" selected>상관없음</option></select>
        </label>
      </div>
      <div class="optrow" id="tools" role="group" aria-label="쓸 수 있는 조리도구"></div>
    </div>
    <button class="btn big" id="go" type="button" disabled>요리 추천받기</button>
    <p class="note">소금·후추·간장·식용유·설탕·고춧가루·참기름·깨·다진 마늘은 있다고 가정해요.</p>
  </section>

  <section id="result" aria-live="polite" aria-busy="false"></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  /* ================== 설정 ================== */
  const PANTRY = ['소금', '후추', '간장', '식용유', '설탕', '고춧가루', '참기름', '깨', '다진 마늘', '물'];
  const QUICK = ['계란', '양파', '대파', '두부', '김치', '밥', '참치캔', '감자', '라면', '소시지', '떡', '어묵'];
  const TOOLS = ['프라이팬', '냄비', '전자레인지', '에어프라이어'];
  const KEY = 'ittaero.v1';

  /* ================== 저장소 (안전하게) ================== */
  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') return s; } catch (e) {}
    return {};
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }
  const store = load();
  if (!Array.isArray(store.cooked)) store.cooked = [];

  const state = {
    ingredients: Array.isArray(store.ingredients) ? store.ingredients.filter((x) => typeof x === 'string').slice(0, 20) : [],
    tools: new Set(Array.isArray(store.tools) ? store.tools.filter((t) => TOOLS.includes(t)) : ['프라이팬', '냄비', '전자레인지']),
    servings: [1, 2, 3, 4].includes(+store.servings) ? +store.servings : 1,
    maxMin: [15, 30, 60].includes(+store.maxMin) ? +store.maxMin : 60,
  };

  /* ================== 재료 이름 정규화 ================== */
  const ALIASES = {
    '계란': ['계란', '달걀', '에그'],
    '대파': ['대파', '쪽파', '실파', '파'],
    '양파': ['양파'],
    '김치': ['김치', '묵은지', '배추김치'],
    '김': ['김', '김가루', '구운김', '김밥김'],
    '참치': ['참치', '참치캔', '캔참치'],
    '밥': ['밥', '쌀밥', '햇반', '즉석밥', '찬밥'],
    '소시지': ['소시지', '비엔나', '프랑크', '후랑크'],
    '햄': ['햄', '스팸', '런천미트'],
    '돼지고기': ['돼지고기', '삼겹살', '목살', '앞다리살', '돼지'],
    '소고기': ['소고기', '쇠고기', '불고기', '차돌박이'],
    '닭고기': ['닭고기', '닭다리', '닭다리살', '닭볶음탕'],
    '닭가슴살': ['닭가슴살', '닭가슴'],
    '두부': ['두부', '순두부'],
    '감자': ['감자'],
    '고구마': ['고구마'],
    '라면': ['라면', '신라면', '진라면', '너구리'],
    '떡': ['떡', '떡볶이떡', '가래떡'],
    '어묵': ['어묵', '오뎅', '사각어묵'],
    '만두': ['만두', '물만두', '군만두'],
    '식빵': ['식빵', '빵', '토스트빵'],
    '파스타': ['파스타', '스파게티', '스파게티면', '파스타면'],
    '마늘': ['마늘', '통마늘', '편마늘'],
    '오이': ['오이'],
    '콩나물': ['콩나물'],
    '양배추': ['양배추'],
    '애호박': ['애호박', '호박'],
    '가지': ['가지'],
    '버섯': ['버섯', '표고', '표고버섯', '느타리', '새송이', '팽이', '양송이'],
    '시금치': ['시금치'],
    '브로콜리': ['브로콜리'],
    '부추': ['부추'],
    '무': ['무'],
    '소면': ['소면', '국수', '잔치국수'],
    '멸치': ['멸치', '잔멸치', '국물멸치'],
    '숙주': ['숙주', '숙주나물'],
    '새우': ['새우', '칵테일새우', '대하'],
    '오징어': ['오징어', '한치'],
    '된장': ['된장'],
    '고추장': ['고추장'],
    '치즈': ['치즈', '슬라이스치즈', '모짜렐라'],
    '버터': ['버터'],
    '마요네즈': ['마요네즈', '마요'],
    '우유': ['우유'],
    '요거트': ['요거트', '요구르트', '요플레'],
    '밀가루': ['밀가루', '부침가루', '튀김가루'],
    '당근': ['당근'],
    '미역': ['미역', '건미역'],
    '양상추': ['양상추', '상추', '샐러드채소'],
    '토마토': ['토마토', '방울토마토'],
    '베이컨': ['베이컨'],
    '바나나': ['바나나'],
    '사과': ['사과'],
  };
  function canon(raw) {
    const s = String(raw).toLowerCase().replace(/\s+/g, '');
    for (const c of Object.keys(ALIASES)) {
      for (const a of ALIASES[c]) {
        if (s === a || (a.length >= 2 && s.includes(a))) return c;
      }
    }
    return s;
  }
  const PANTRY_WORDS = ['소금', '후추', '간장', '식용유', '설탕', '고춧가루', '참기름', '깨', '다진 마늘', '물', '기름'];
  function isPantryWord(x) {
    const c = String(x).replace(/\s+/g, '');
    return PANTRY_WORDS.some((p) => { const q = p.replace(/\s+/g, ''); return c === q || (q.length >= 2 && c.includes(q)); });
  }

  /* ================== 내장 레시피 (AI 서버에 연결하지 못했을 때) ================== */
  // 규칙: 재료 목록과 조리 단계에는 needs(필수 재료)와 기본 양념만 쓴다. 있으면 좋은 재료(opt)는 추천할 때 따로 덧붙인다.
  // ings: [이름, 수량(숫자면 인분에 따라 곱함, 없으면 null), 단위 또는 문구]
  const R = (name, minutes, level, tools, needs, opt, desc, ings, steps, tip) =>
    ({ name, minutes, level, tools, needs, opt, desc, ings, steps, tip });
  const DB = [
    R('계란볶음밥', 10, '쉬움', ['프라이팬'], ['밥', '계란'], ['대파', '양파', '당근', '햄', '소시지'], '냉장고 털이의 기본. 고슬고슬하게 볶아요.',
      [['밥', 1, '공기'], ['계란', 2, '개'], ['식용유', null, '1숟가락'], ['간장', null, '1숟가락'], ['소금·후추', null, '약간']],
      ['기름 두른 팬에 계란을 풀어 스크램블로 익혀요.', '밥을 넣고 센 불에서 뭉치지 않게 볶아요.', '팬 가장자리에 간장을 둘러 향을 내요.', '소금·후추로 간을 맞춰요.'], '찬밥을 쓰면 더 고슬고슬해요.'),
    R('김치볶음밥', 15, '쉬움', ['프라이팬'], ['김치', '밥'], ['계란', '참치', '대파', '햄', '소시지'], '남은 김치를 가장 빨리 해치우는 방법.',

  function fmtAmount(ing, servings) {
    const q = ing[1], u = ing[2];
    if (q == null) return u;
    if (u === 'g' || u === 'ml') return Math.round(q * servings) + u;
    const v = Math.round(q * servings * 2) / 2;
    return (v % 1 === 0 ? v : v.toFixed(1)) + u;
  }

  function localRecommend(list, opts) {
    const userCanon = new Map(); // 표준 이름 → 사용자가 적은 이름
    list.forEach((x) => { const c = canon(x); if (!userCanon.has(c)) userCanon.set(c, x); });
    const wanted = Array.from(userCanon.keys()).filter((c) => !isPantryWord(c));
    const cands = [];
    DB.forEach((r) => {
      if (r.minutes > opts.maxMin) return;
      if (!r.tools.every((t) => opts.tools.includes(t))) return;
      const have = r.needs.filter((n) => userCanon.has(n));
      const missing = r.needs.filter((n) => !userCanon.has(n));
      if (!have.length || missing.length > 2) return;
      const optHave = r.opt.filter((n) => userCanon.has(n)).slice(0, 3);
      cands.push({ r, have, missing, optHave, covers: new Set(have.concat(optHave)) });
    });
    // 입력한 재료가 골고루 쓰이도록 고른다: 새로 쓰이는 재료가 많은 요리를 먼저.
    const covered = new Set();
    const picked = [];
    function pick(pool, limit) {
      while (picked.length < limit && pool.length) {
        let best = 0, bs = -1e9;
        pool.forEach((c, i) => {
          let fresh = 0;
          c.covers.forEach((k) => { if (!covered.has(k)) fresh++; });
          const s = fresh * 4 + c.have.length * 2 + c.optHave.length - c.missing.length * 3 - c.r.minutes / 60;
          if (s > bs) { bs = s; best = i; }
        });
        const c = pool.splice(best, 1)[0];
        picked.push(c);
        c.covers.forEach((k) => covered.add(k));
      }
    }
    const ready = cands.filter((c) => !c.missing.length);
    const buy = cands.filter((c) => c.missing.length);
    pick(ready, 3);
    pick(buy, 5);
    if (picked.length < 5) pick(ready, 5);
    picked.sort((a, b) => a.missing.length - b.missing.length);

    const nm = (k) => userCanon.get(k) || k;
    const recipes = picked.map((c) => {
      const r = c.r;
      const rows = r.ings.map((i) => ({ name: i[0], amount: fmtAmount(i, opts.servings) }));
      const steps = r.steps.slice();
      if (c.optHave.length) {
        const names = c.optHave.map(nm);
        names.forEach((n) => rows.push({ name: n, amount: '있는 만큼' }));
        steps.splice(1, 0, '냉장고에 있는 ' + names.join(', ') + '도 먹기 좋게 썰어 주재료와 함께 조리해요.');
      }
      return {
        name: r.name, summary: r.desc, minutes: r.minutes, difficulty: r.level,
        usedIngredients: c.have.concat(c.optHave).map(nm),
        missingIngredients: c.missing,
        ingredientsDetail: rows, steps, tip: r.tip,
      };
    });
    const unused = wanted.filter((k) => !covered.has(k)).map(nm);
    return { recipes, unused };
  }

  /* ================== 음식 사진 (위키백과에서 불러오기) ================== */
  const DISH_TYPES = ['볶음밥', '비빔밥', '덮밥', '김치찌개', '된장찌개', '찌개', '국수', '파스타', '라면', '토스트', '샌드위치', '오믈렛', '계란말이', '계란찜', '샐러드', '튀김', '전골', '카레', '리조또', '수프']
    .sort((a, b) => b.length - a.length);
  const photoCache = new Map();
  function photoNames(name) {
    const n = String(name).replace(/\([^)]*\)/g, '').replace(/\s+/g, '');
    const c = [n];
    DISH_TYPES.forEach((t) => { if (n.endsWith(t) && n !== t && !c.includes(t)) c.push(t); });
    return c.slice(0, 3);
  }
  function fetchSummary(title) {
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 6000);
    return fetch('https://ko.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title) + '?redirect=true', { signal: ctl.signal })
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => (d && d.type === 'standard' && d.thumbnail && /^https:\/\//.test(d.thumbnail.source || '')
        ? { src: d.thumbnail.source, page: (d.content_urls && d.content_urls.desktop && d.content_urls.desktop.page) || '', title: d.title || title }
        : null))
      .catch(() => null)
      .then((v) => { clearTimeout(tm); return v; });
  }
  function getPhoto(name) {
    if (photoCache.has(name)) return photoCache.get(name);
    const p = (async () => {
      for (const c of photoNames(name)) { const r = await fetchSummary(c); if (r) return r; }
      return null;
    })();
    photoCache.set(name, p);
    // 못 찾은 결과는 잠깐만 기억해서, 네트워크가 잠시 끊겼던 경우 다시 시도할 수 있게 한다.
    p.then((v) => { if (!v) setTimeout(() => photoCache.delete(name), 30000); });
    return p;
  }
  function emoji(name) {
    const n = String(name);
    if (/찌개|국$|탕|전골/.test(n)) return '🍲';
    if (/라면|국수|파스타|면/.test(n)) return '🍜';
    if (/밥|덮밥|주먹밥/.test(n)) return '🍚';
    if (/계란|오믈렛/.test(n)) return '🍳';
    if (/토스트|샌드위치|빵/.test(n)) return '🥪';
    if (/샐러드|무침|나물/.test(n)) return '🥗';
    if (/전$|부침|파전/.test(n)) return '🥞';
    if (/튀김|만두/.test(n)) return '🥟';
    if (/새우|오징어/.test(n)) return '🍤';
    if (/고구마|감자/.test(n)) return '🍠';
    if (/요거트/.test(n)) return '🥣';
    return '🍽️';
  }
  function loadPhotos() {
    document.querySelectorAll('.ph[data-photo]').forEach((el) => {
      getPhoto(el.getAttribute('data-photo')).then((p) => {
        if (!p || !el.isConnected) return;
        const img = new Image();
        img.alt = '';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.onload = () => {
          if (!el.isConnected) return;
          const wrap = document.createElement(p.page ? 'a' : 'span');
          if (p.page) { wrap.href = p.page; wrap.target = '_blank'; wrap.rel = 'noopener noreferrer'; }
          wrap.title = '사진: 위키백과 「' + p.title + '」';
          wrap.appendChild(img);
          el.textContent = '';
          el.appendChild(wrap);
          const c = document.querySelector('.credit'); if (c) c.hidden = false;
        };
        img.src = p.src;
      });
    });
  }

    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function persist() {
    store.ingredients = state.ingredients;

    $('quick').innerHTML = QUICK.map((q) => {
      const on = state.ingredients.some((x) => canon(x) === canon(q));

      '<button type="button" class="tool" data-tool="' + t + '" aria-pressed="' + state.tools.has(t) + '">' + t + '</button>').join('');

  function addIngredients(text) {
    String(text).split(/[,，、·\n\s]+/).map((s) => s.trim().slice(0, 20)).filter(Boolean).forEach((s) => {
      if (state.ingredients.length >= 20) return;
      if (!state.ingredients.some((x) => canon(x) === canon(s))) state.ingredients.push(s);
    });
    persist(); renderInputs();
  }

    const d = new Date(); const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    return store.cooked.filter((c) => c && typeof c.d === 'string' && c.d.slice(0, 7) === ym).length;

  function card(r, open) {
    const used = r.usedIngredients.map((x) => '<span class="tg have">' + esc(x) + '</span>').join('');
    const need = r.missingIngredients.map((x) => '<span class="tg need">필요: ' + esc(x) + '</span>').join('');
    const ings = r.ingredientsDetail.map((d) => '<li><span>' + esc(d.name) + '</span><span>' + esc(d.amount) + '</span></li>').join('');
    const steps = r.steps.map((s) => '<li>' + esc(s) + '</li>').join('');
    return '<article class="card rcard">' +
      '<div class="rtop"><div class="ph" data-photo="' + esc(r.name) + '" aria-hidden="true">' + emoji(r.name) + '</div>' +
      '<div class="rmain"><h3>' + esc(r.name) + '</h3><p class="meta">' + esc(r.minutes) + '분 · ' + esc(r.difficulty) + '</p>' +
      '<p class="sum">' + esc(r.summary) + '</p>' +
      '<div class="tags">' + used + need + '</div></div></div>' +
      '<details' + (open ? ' open' : '') + '><summary>레시피 보기</summary><div class="body">' +
      (ings ? '<h4>재료 (' + state.servings + '인분)</h4><ul class="ing">' + ings + '</ul>' : '') +

      '</div></details></article>';

  function renderResult(recipes, mode, why, unused) {

      ? '<span class="badge ai">AI 추천</span><span>입력한 재료와 조건에 맞춰 새로 만들었어요.</span>'
      : '<span class="badge local">기본 레시피 모드</span><span>' + esc(why || 'AI 서버에 연결하지 못해 내장 레시피에서 골랐어요.') + '</span>';
    let html = '<p class="status">' + badge + '</p>';
    if (unused && unused.length) {
      html += '<p class="unused">이번 결과에 쓰이지 않은 재료: <b>' + unused.map(esc).join(', ') + '</b>. ' +
        (mode === 'ai' ? '다시 눌러 다른 조합을 받아 보세요.' : '기본 레시피에는 이 재료를 쓰는 요리가 아직 없어요. AI 추천에서는 반영돼요.') + '</p>';
    }
    if (!recipes.length) {
      html += '<div class="card empty">맞는 요리를 찾지 못했어요.<br>재료를 몇 개 더 추가하거나 시간·도구 조건을 넓혀 보세요.</div>';
      el.innerHTML = html; return;
    }
    const now = recipes.filter((r) => !r.missingIngredients.length);
    const buy = recipes.filter((r) => r.missingIngredients.length);
    let first = true;
    if (now.length) {
      html += '<h2 class="sec">지금 바로 만들 수 있어요 <span>' + now.length + '개</span></h2>';
      now.forEach((r) => { html += card(r, first); first = false; });

    el.innerHTML = html;
    loadPhotos();
  }

  function normalize(r) {
    const arr = (v, n) => (Array.isArray(v) ? v : []).map((x) => String(x == null ? '' : x).slice(0, 200)).filter(Boolean).slice(0, n);
    return {
      name: String(r.name || '').slice(0, 40),
      summary: String(r.summary || '').slice(0, 120),
      minutes: Math.max(1, parseInt(r.minutes, 10) || 15),
      difficulty: r.difficulty === '보통' ? '보통' : '쉬움',
      usedIngredients: arr(r.usedIngredients, 12),
      missingIngredients: arr(r.missingIngredients, 6),
      ingredientsDetail: (Array.isArray(r.ingredientsDetail) ? r.ingredientsDetail : []).slice(0, 14)
        .map((d) => ({ name: String((d && d.name) || '').slice(0, 30), amount: String((d && d.amount) || '').slice(0, 30) })).filter((d) => d.name),
      steps: arr(r.steps, 10),
      tip: String(r.tip || '').slice(0, 160),
    };
  }

  async function recommend() {
    if (!state.ingredients.length) return;
    const el = $('result');
    el.setAttribute('aria-busy', 'true');
    el.innerHTML = '<p class="loading-t">냉장고를 살펴보는 중이에요…</p><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    $('go').disabled = true;
    const opts = { servings: state.servings, maxMin: state.maxMin, tools: Array.from(state.tools) };
    let why = '';
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 12000);
      const r = await fetch('/api/recipes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ingredients: state.ingredients, servings: opts.servings, maxMinutes: opts.maxMin, tools: opts.tools }),
        signal: ctl.signal,
      });
      clearTimeout(timer);
      if (!r.ok) throw new Error('http ' + r.status);
      const data = await r.json();
      const list = (data && Array.isArray(data.recipes) ? data.recipes : []).map(normalize).filter((x) => x.name && x.steps.length);
      if (!list.length) throw new Error('empty');
      const unusedAi = Array.isArray(data.unused) ? data.unused.map((x) => String(x).slice(0, 20)).slice(0, 20) : [];
      renderResult(list, 'ai', '', unusedAi);
      $('go').disabled = false;
      return;
    } catch (e) {
      why = (e && e.name === 'AbortError')
        ? 'AI 응답이 늦어 내장 레시피에서 골랐어요.'
        : 'AI 서버에 연결하지 못해 내장 레시피에서 골랐어요. (Vercel에 배포하고 API 키를 설정하면 AI 추천이 켜져요)';
    }
    const lr = localRecommend(state.ingredients, opts);
    renderResult(lr.recipes, 'local', why, lr.unused);
    $('go').disabled = false;
  }

  /* ================== 이벤트 ================== */
  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const inp = $('ingInput');
    if (inp.value.trim()) { addIngredients(inp.value); inp.value = ''; }
    inp.focus();
  });
  $('ingInput').addEventListener('paste', () => {
    setTimeout(() => { const inp = $('ingInput'); if (/[,\n，、]/.test(inp.value)) { addIngredients(inp.value); inp.value = ''; } }, 0);
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    if (t.hasAttribute('data-rm')) {
      state.ingredients.splice(+t.getAttribute('data-rm'), 1); persist(); renderInputs();
    } else if (t.hasAttribute('data-q')) {
      const q = t.getAttribute('data-q');
      const idx = state.ingredients.findIndex((x) => canon(x) === canon(q));
      if (idx >= 0) state.ingredients.splice(idx, 1); else addIngredients(q);
      persist(); renderInputs();
    } else if (t.hasAttribute('data-tool')) {
      const k = t.getAttribute('data-tool');
      if (state.tools.has(k)) state.tools.delete(k); else state.tools.add(k);
      persist(); renderInputs();
    } else if (t.hasAttribute('data-cooked')) {
      const d = new Date();
      store.cooked.push({ n: t.getAttribute('data-cooked'), d: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') });
      store.cooked = store.cooked.slice(-300);
      save(); renderCount(); toast('기록했어요. 맛있게 드세요!');
    }
  });
  $('go').addEventListener('click', recommend);
  $('servings').addEventListener('change', (e) => { state.servings = +e.target.value; persist(); });
  $('maxMin').addEventListener('change', (e) => { state.maxMin = +e.target.value; persist(); });

  renderInputs();
  renderCount();
})();
</script>
</body>
</html>
